    SearchResultDto:
      type: object
      properties:
        symbol: {type: string}
        name: {type: string}
        exchange: {type: string}
        type: {type: string}
    MarketIndexDto:
      type: object
      properties:
        symbol: {type: string}
        name: {type: string}
        value: {type: number, format: double}
        change: {type: number, format: double}
        changePercent: {type: number, format: double}
        timestamp: {type: string, format: date-time}
    TrendingCoinDto:
      type: object
      properties:
        symbol: {type: string}
        name: {type: string}
        koreanName: {type: string}
        marketCode: {type: string}
        price: {type: number, format: double}
        changePercent: {type: number, format: double}
        volume: {type: number, format: double}
        tradeValue: {type: number, format: double}
        rank: {type: integer, format: int32}
        baseCurrency: {type: string}
    ServerSentEventCryptoPriceDto: {type: object}
    CryptoSearchResultDto:
      type: object
      properties:
        symbol: {type: string}
        name: {type: string}
        koreanName: {type: string}
        marketCode: {type: string}
        baseCurrency: {type: string}
        tradeable: {type: boolean}
        exchange: {type: string}
    BacktestStatusResponse:
      type: object
      properties:
        available: {type: boolean}
        providers:
          type: array
          items: {type: string}
        supportedFrequencies:
          type: array
          items: {type: string}
        maxDateRange: {type: string}
    HistoricalPriceData:
      type: object
      properties:
        date: {type: string, format: date}
        open: {type: number, format: double}
        high: {type: number, format: double}
        low: {type: number, format: double}
        close: {type: number, format: double}
        volume: {type: integer, format: int64}
        adjustedClose: {type: number, format: double}
    HistoricalPriceResponse:
      type: object
      properties:
        symbol: {type: string}
        startDate: {type: string, format: date}
        endDate: {type: string, format: date}
        dataPoints: {type: integer, format: int32}
        prices:
          type: array
          items: {$ref: '#/components/schemas/HistoricalPriceData'}
