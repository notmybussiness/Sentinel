# =====================================================
# PostgreSQL 15 Configuration for Sentinel
# =====================================================
# Optimized for:
# - 8GB RAM server (Intel 8250U)
# - DAU 100, concurrent users ~20
# - PostgreSQL gets ~2GB of system memory
# =====================================================

# -----------------------------------------------------
# Memory Settings
# -----------------------------------------------------
# shared_buffers: 25% of available memory for PostgreSQL
shared_buffers = 512MB

# effective_cache_size: Total memory available for disk caching
# Should be ~50-75% of total system RAM
effective_cache_size = 2GB

# work_mem: Memory for sort operations and hash tables
# Be careful: this is per-operation, not per-connection
work_mem = 32MB

# maintenance_work_mem: Memory for VACUUM, CREATE INDEX, etc.
maintenance_work_mem = 128MB

# -----------------------------------------------------
# Connection Settings
# -----------------------------------------------------
# max_connections: DAU 100 with connection pooling = 50 is plenty
max_connections = 50

# -----------------------------------------------------
# Write-Ahead Log (WAL) Settings
# -----------------------------------------------------
# wal_buffers: Memory for WAL (usually 3% of shared_buffers)
wal_buffers = 16MB

# checkpoint_completion_target: Spread checkpoint I/O
checkpoint_completion_target = 0.9

# min_wal_size / max_wal_size: WAL size limits
min_wal_size = 256MB
max_wal_size = 1GB

# -----------------------------------------------------
# Query Planner Settings
# -----------------------------------------------------
# random_page_cost: Lower for SSD (default 4.0 is for HDD)
random_page_cost = 1.1

# effective_io_concurrency: Higher for SSD
effective_io_concurrency = 200

# -----------------------------------------------------
# Background Writer Settings
# -----------------------------------------------------
bgwriter_delay = 200ms
bgwriter_lru_maxpages = 100
bgwriter_lru_multiplier = 2.0

# -----------------------------------------------------
# Logging Settings
# -----------------------------------------------------
logging_collector = on
log_directory = 'pg_log'
log_filename = 'postgresql-%Y-%m-%d.log'
log_rotation_age = 1d
log_rotation_size = 100MB

# Log slow queries (> 1 second)
log_min_duration_statement = 1000

# Log connection/disconnection
log_connections = on
log_disconnections = on

# Log lock waits
log_lock_waits = on

# -----------------------------------------------------
# Autovacuum Settings
# -----------------------------------------------------
autovacuum = on
autovacuum_max_workers = 2
autovacuum_naptime = 1min
autovacuum_vacuum_threshold = 50
autovacuum_analyze_threshold = 50
autovacuum_vacuum_scale_factor = 0.1
autovacuum_analyze_scale_factor = 0.05

# -----------------------------------------------------
# Statistics Settings
# -----------------------------------------------------
track_activities = on
track_counts = on
track_io_timing = on
track_functions = all

# -----------------------------------------------------
# Locale and Encoding
# -----------------------------------------------------
lc_messages = 'en_US.UTF-8'
lc_monetary = 'en_US.UTF-8'
lc_numeric = 'en_US.UTF-8'
lc_time = 'en_US.UTF-8'

# Listen on all interfaces
listen_addresses = '*'
port = 5432
