apiVersion: 1

datasources:
  # k6 metrics from InfluxDB
  - name: k6
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    database: k6
    isDefault: true
    editable: true

  # Spring Boot metrics from Prometheus
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    editable: true
