### Scouter Java Agent Configuration - Sentinel Backend
### PC1 (192.168.0.58) -> PC2 Collector (192.168.0.5:6100)
### Last Updated: 2025-11-04

# ==================== 기본 설정 ====================

# Object Name (애플리케이션 식별자)
obj_name=Sentinel-Backend

# Collector Server (PC2)
net_collector_ip=192.168.0.5
net_collector_udp_port=6100
net_collector_tcp_port=6100

# Network Settings
net_udp_packet_max_bytes=60000
net_tcp_so_timeout_ms=60000
net_tcp_connection_timeout_ms=3000

# ==================== Performance Counter ====================

counter_enabled=true
counter_interaction_enabled=true

# ==================== HTTP Profiling ====================

# HTTP Header 수집
profile_http_header_enabled=true
profile_http_parameter_enabled=true
profile_http_querystring_enabled=true

# Client IP 추출 (X-Forwarded-For 헤더)
trace_http_client_ip_header_key=X-Forwarded-For

# ==================== SQL Profiling ====================

# SQL 파라미터 수집
profile_sql_escape_enabled=true
profile_sql_param_enabled=true
profile_connection_open_enabled=true
trace_sqlcall_enabled=true

# Background SQL 추적
trace_background_sql_enabled=true

# ==================== Spring Framework ====================

# Spring Controller 메서드 파라미터 프로파일링
profile_spring_controller_method_parameter_enabled=true

# ==================== Method Hook Patterns ====================

# Sentinel 패키지 추적
hook_method_patterns=com.pjsent.sentinel.portfolio.service.*Service.*,com.pjsent.sentinel.market.service.*Service.*,com.pjsent.sentinel.crypto.service.*Service.*,com.pjsent.sentinel.ai.service.*Service.*,com.pjsent.sentinel.backtest.service.*Service.*,com.pjsent.sentinel.rebalancing.service.*Service.*

# ==================== Exception Handling ====================

# Exception 프로파일링
profile_fullstack_hooked_exception_enabled=true

# ==================== Active Service ====================

# Active Service 임계값 (ms)
trace_activeserivce_yellow_time=3000
trace_activeserivce_red_time=8000

# ==================== XLog (Transaction Log) ====================

# XLog 샘플링 (전체 수집)
xlog_lower_bound_time_ms=0
xlog_sampling_enabled=false
xlog_sampling_step1_ms=100
xlog_sampling_step1_rate_pct=3

# ==================== Alert ====================

alert_message_length=3000
alert_send_interval_ms=10000

# ==================== Log ====================

log_rotation_enabled=true
log_keep_days=7
